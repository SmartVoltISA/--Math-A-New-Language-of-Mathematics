[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-math"
version = "0.9.0"
description = "Reference interpreter for the Ω-Math v0.9 typed relational language"
requires-python = ">=3.10"

[project.scripts]
omega-math = "omega_math.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
